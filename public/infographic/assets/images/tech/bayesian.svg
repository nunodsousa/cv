<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#6366f1"/>
  
  <!-- Bayesian Network Nodes -->
  <!-- Top node (prior) -->
  <circle cx="32" cy="14" r="7" fill="white"/>
  <circle cx="32" cy="14" r="4" fill="#6366f1"/>
  
  <!-- Middle left node -->
  <circle cx="18" cy="32" r="7" fill="white"/>
  <circle cx="18" cy="32" r="4" fill="#6366f1"/>
  
  <!-- Middle right node -->
  <circle cx="46" cy="32" r="7" fill="white"/>
  <circle cx="46" cy="32" r="4" fill="#6366f1"/>
  
  <!-- Bottom node (posterior) -->
  <circle cx="32" cy="50" r="7" fill="white"/>
  <circle cx="32" cy="50" r="4" fill="#6366f1"/>
  
  <!-- Connecting edges (arrows) -->
  <!-- Top to middle left -->
  <line x1="26" y1="19" x2="22" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Top to middle right -->
  <line x1="38" y1="19" x2="42" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Middle left to bottom -->
  <line x1="22" y1="38" x2="28" y2="45" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Middle right to bottom -->
  <line x1="42" y1="38" x2="36" y2="45" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- P symbol for Probability -->
  <text x="32" cy="14" y="17" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle">P</text>
</svg>
