<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#3b5998"/>
  
  <!-- Time series line (forecasting curve) -->
  <path d="M12 42 L20 38 L28 40 L36 30 L44 32 L52 22" 
        stroke="white" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>
  
  <!-- Forecast dashed line -->
  <path d="M44 32 L52 22 L56 18" 
        stroke="rgba(255,255,255,0.5)" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-dasharray="4 3"
        fill="none"/>
  
  <!-- Data points -->
  <circle cx="20" cy="38" r="3" fill="white"/>
  <circle cx="28" cy="40" r="3" fill="white"/>
  <circle cx="36" cy="30" r="3" fill="white"/>
  <circle cx="44" cy="32" r="3" fill="white"/>
  
  <!-- P letter for Prophet -->
  <text x="32" y="54" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">Prophet</text>
</svg>
